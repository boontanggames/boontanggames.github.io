name: Publish website on GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: boontang-website-pages-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Request and verify the configured Pages build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out the dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test publication state handling
        run: python3 -m unittest discover -s .github/scripts -p 'test_publish_pages.py' -v
      - name: Publish the existing main-branch website
        run: python3 .github/scripts/publish_pages.py
